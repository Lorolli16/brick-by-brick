# Builds the static site and publishes it to the gh-pages branch on every push to main.
# GitHub Pages serves that branch at https://<owner>.github.io/<repo>/
# (Settings -> Pages -> Source: "Deploy from a branch", branch gh-pages, folder / root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build:static
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Publish to gh-pages branch
        working-directory: dist-static
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
